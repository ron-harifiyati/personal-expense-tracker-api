[build]
  command = "npm run build"
  publish = "dist"

# SPA fallback so client-side routes work on refresh.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Set VITE_API_URL in the Netlify UI (Site settings → Environment variables),
# or configure it at runtime from the app's login screen.
