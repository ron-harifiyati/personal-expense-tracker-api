# Render.com blueprint — deploy with New → Blueprint, pointed at this repo.
services:
  - type: web
    name: expense-tracker-api
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    # A persistent disk keeps the SQLite database across restarts/deploys.
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_STORAGE
        value: /var/data/database.sqlite
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGIN
        value: "*"
